[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-identity-governance-pack"
version = "0.1.0.dev2"
description = "Governance for federation assurance, IdP and RP trust, OIDC and SAML assertions, metadata, keys, subject identifiers, attribute release, and federation audit evidence."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "Jacob Stewart", email = "jacob@swarmauri.com" }]
dependencies = [
  "ssot-pack-contracts>=0.2.17,<0.3.0",
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = [
  "ssot",
  "ssot-registry",
  "ssot-pack-contracts",
  "governance-pack",
  "federation",
  "fal",
  "oidc",
  "saml",
  "identity-provider",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/groupsum/federated-identity-governance-pack"
Repository = "https://github.com/groupsum/federated-identity-governance-pack"
Issues = "https://github.com/groupsum/federated-identity-governance-pack/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"federated_identity_governance_pack" = ["metadata.json"]
"federated_identity_governance_pack.templates.adr" = ["*.json", "*.yaml"]
"federated_identity_governance_pack.templates.specs" = ["*.json", "*.yaml"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.readme_standards]
policy = "package-guide-v1"
brand = "groupsum"
brand_catalog = "docs/readme-brands.toml"
repository = "https://github.com/groupsum/federated-identity-governance-pack"
ref = "master"
package_path = "."
layer = "governance"
lifecycle = "active"
license_file = "LICENSE"

[tool.readme_standards.distributions.pypi]
name = "federated-identity-governance-pack"
published = true

[tool.readme_standards.examples.quick_start]
source = "examples/quick_start.py"
expected_stdout = "examples/quick_start.stdout"
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.examples.usage]
source = "examples/usage.py"
expected_exit_code = 0
test = ".github/workflows/readme-standards.yml"

[tool.readme_standards.statuses.readme]
label = "CI gate"
url = "https://github.com/groupsum/federated-identity-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.tests]
label = "package and example checks"
url = "https://github.com/groupsum/federated-identity-governance-pack/actions/workflows/readme-standards.yml"

[tool.readme_standards.statuses.certification]
label = "not certified"
url = "https://github.com/groupsum/federated-identity-governance-pack/blob/master/README.md#certification-status"

[tool.readme_standards.statuses.governance]
label = "pack governance"
url = "https://github.com/groupsum/federated-identity-governance-pack/blob/master/docs/governance/pack-authoring-guide.md"

[tool.readme_standards.statuses.evidence]
label = "README and wheel checks"
url = "https://github.com/groupsum/federated-identity-governance-pack/actions/workflows/readme-standards.yml"
